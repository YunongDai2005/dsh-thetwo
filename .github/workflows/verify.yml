name: Verify TheTwo
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      commit:
        type: string
        required: true
      archive_url:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Pack the release once
        env:
          ARCHIVE_URL: ${{ inputs.archive_url }}
        run: |
          mkdir -p artifacts
          npm run check
          if [[ -n "$ARCHIVE_URL" ]]; then
            version=$(node -p "require('./package.json').version")
            curl --fail --location --retry 3 "$ARCHIVE_URL" -o "artifacts/dsh-thetwo-$version.tgz"
          else
            npm pack --ignore-scripts --pack-destination artifacts
          fi
          npm run verify:pack
      - uses: actions/upload-artifact@v4
        with:
          name: thetwo-package
          overwrite: true
          path: |
            artifacts/*.tgz
            artifacts/SHA256SUMS-*.txt
            artifacts/verification-*.json
  host:
    needs: package
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        dsh: ['0.2.0-rc.2', latest]
    env:
      DSH_TEST_NODE_MODULES: .preview/ci-host/node_modules
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm install --global pnpm@11 --no-audit --no-fund
      - run: npm install --prefix .preview/ci-host --ignore-scripts --no-audit --no-fund @deepseek-ai/dsh@${{ matrix.dsh }}
        shell: bash
      - run: npm run test:all
      - uses: actions/download-artifact@v4
        with:
          name: thetwo-package
          path: artifacts
      - run: npm run verify:pack
      - run: npm run verify:install
